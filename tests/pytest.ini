[pytest]
pythonpath = ..
testpaths = .
norecursedirs = .* reports pytest-cache-files-*
addopts = -ra --strict-markers
markers =
    unit: reglas y schemas aislados de BD, HTTP y correo
    integration: componentes reales con base de datos de prueba
    e2e: flujos por HTTP externo contra API y BD de prueba
