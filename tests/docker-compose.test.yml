name: backend-grupo1-tests

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokemon_test
      POSTGRES_PASSWORD: pokemon_test
      POSTGRES_DB: pokemon_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon_test -d pokemon_test"]
      interval: 2s
      timeout: 5s
      retries: 20
