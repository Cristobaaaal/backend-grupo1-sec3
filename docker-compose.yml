services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemon_api
    restart: unless-stopped
    # En local además se cargan los datos de demostración.
    # El seeder no duplica: omite los registros que ya existen.
    command: >
      sh -c "alembic upgrade head
      && python -m app.infrastructure.seeders.seed
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://pokemon_user:pokemon_pass@postgres:5432/pokemon_db}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pokemon_network

  postgres:
    image: postgres:16-alpine
    container_name: pokemon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokemon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pokemon_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pokemon_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pokemon_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@pokemon.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - pokemon_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  pokemon_network:
    driver: bridge
